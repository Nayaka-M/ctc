<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JavaScript Image Change</title>

</head>

<body>

    <h1>What JavaScript Can Do</h1>

    <p>In this case JavaScript changes the value of the src.</p>

    <button
        onclick="document.getElementById('myImage').src='https://www.w3schools.com/js/pic_bulbon.gif'">
        Turn On
    </button>

    <img
        id="myImage"
        src="https://www.w3schools.com/js/pic_bulboff.gif"
        style="width:100px">

    <button
        onclick="document.getElementById('myImage').src='https://www.w3schools.com/js/pic_bulboff.gif'">
        Turn Off
    </button>

</body>

</html>
